services:
  web:
    build: .
    container_name: chorequest-web
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - chorequest_net

  db:
    image: postgres:16-alpine
    container_name: chorequest-db
    environment:
      POSTGRES_DB: ${DB_NAME:-chorequest}
      POSTGRES_USER: ${DB_USER:-chorequest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chorequest}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chorequest_net

volumes:
  postgres_data:

networks:
  chorequest_net:
    driver: bridge
